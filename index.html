<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#004C6A"><title>صدای تجربه شما | کارگزاری مفید</title><link rel="stylesheet" href="styles.css"><script defer src="config.js"></script><script defer src="topics.js"></script><script defer src="schema.js"></script><script defer src="app.js"></script></head>
<body>
<header><a href="./" aria-label="صفحه نخست"><img src="assets/logo.webp" alt="کارگزاری مفید؛ پیشرفت مداوم" width="230" height="47"></a><span>تیم تجربه مشتری <i></i> پروژه بهبود تاکسونومی</span></header>
<div class="shell"><aside><div class="photo" id="photo"></div><div class="aside-content"><span class="eyebrow">با هم، برای پیشرفت مداوم</span><h1>تجربه شما،<br><em>آغاز یک بهبود.</em></h1><p>مسیر ثبت و ارجاع تیکت‌ها را<br>با نگاه شما بهتر می‌کنیم.</p><nav id="steps" aria-label="مراحل پرسشنامه"></nav><div class="aside-footer">حرفه‌ای، نوآور، قابل اعتماد</div></div></aside>
<main><div class="progress-head"><span id="progressText">آماده شنیدن تجربه شما هستیم</span><strong id="percent">۰٪</strong></div><progress id="progress" max="100" value="0" aria-label="درصد تکمیل پاسخ‌های الزامی"></progress><div id="content"></div><p id="error" role="alert" tabindex="-1"></p><div id="actions" class="actions"></div><footer><label><input type="checkbox" id="remember"> ذخیره پیش‌نویس در همین مرورگر</label><span id="saveStatus" role="status"></span><button class="text-button" id="clear" type="button">پاک‌کردن پیش‌نویس</button><small>در دستگاه مشترک، ذخیره پیش‌نویس را فعال نکنید. اطلاعات حساس مشتریان را در پاسخ‌ها ننویسید.</small></footer></main></div>
<noscript>برای تکمیل پرسشنامه، جاوااسکریپت مرورگر را فعال کنید.</noscript>
</body></html>
